- id: apphost
  layout: content
  title: One AppHost for three languages
  blocks:
  - type: columns
    widths:
    - 4
    - 6
    columns:
    - - type: code
        language: csharp
        filename: AppHost.cs
        caption: aspire run starts all of it. WaitFor waits until the resource is healthy.
        code: |
          var server = builder
            .AddProject<Projects.CookieJar_Server>("server")
            .WithReference(db).WaitFor(db)
            .WithReference(rabbitmq).WaitFor(rabbitmq)
            .WithReplicas(2);

          builder.AddPythonApp("cookie-sensor", ...)
            .WithReference(rabbitmq);

          builder.AddViteApp("frontend", "../frontend")
            .WithReference(server);
    - - type: image
        src: img/dashboard-graph.png
        alt: The resource graph in the Aspire dashboard. Two server replicas, postgres, messaging, cookie-sensor and frontend. All are healthy.
- id: dashboard
  layout: content
  title: Logs, traces and metrics in one dashboard
  blocks:
  - type: columns
    widths:
    - 4
    - 6
    columns:
    - - type: list
        title: What you get
        items:
        - OpenTelemetry from AddServiceDefaults()
        - Console and structured logs for each replica
        - Traces across the services
        - Start, stop and restart for each resource
      - type: text
        text: The two replicas take turns. RabbitMQ gives each event to one of them.
    - - type: image
        src: img/dashboard-traces.png
        alt: The traces page. The cookie-taken events go to server-juwhhcaw and server-nsfcsabm in turns.
- id: parameters
  layout: content
  title: Parameters and secrets
  blocks:
  - type: columns
    widths:
    - 5
    - 5
    columns:
    - - type: code
        language: csharp
        filename: AppHost.cs
        code: |
          // A secret has no default value
          var password = builder.AddParameter(
              "rabbitmq-password", secret: true);

          // Read the configuration, then use the default
          var capacity = builder.AddParameter(
              "cookie-jar-capacity",
              config["Parameters:cookie-jar-capacity"] ?? "100");
    - - type: image
        src: img/dashboard-parameters.png
        alt: The parameters tab in the dashboard. cookie-jar-capacity is 100, rabbitmq-password is hidden.
      - type: callout
        variant: warning
        title: A trap that a test found
        text: AddParameter(name, "100") is a constant. Aspire then ignores the configuration.
- id: internals
  layout: content
  title: How Aspire works
  blocks:
  - type: mermaid
    diagram: |
      flowchart LR
        A[AppHost<br/>.NET] -- API --> B[DCP<br/>Go binary]
        B -- starts --> C[Containers<br/>and processes]
        C -- OTLP --> D[Dashboard]
  - type: box
    items:
    - label: Model
      text: Each resource is an IResource with annotations. Build() makes the model real.
    - label: WithReference
      text: Gives ConnectionStrings__name as an environment variable, with the dynamic port.
    - label: WaitFor
      text: Holds the start until the dependency is healthy.
- id: testing
  layout: content
  title: Aspire.Hosting.Testing
  blocks:
  - type: text
    text: The AppHost is the test fixture. The test gets the same topology as aspire run.
  - type: columns
    widths:
    - 5
    - 5
    columns:
    - - type: code
        language: csharp
        filename: AppModelTests.cs
        caption: 'Model test: no containers, less than 1 s.'
        code: |
          var builder = await DistributedApplicationTestingBuilder
              .CreateAsync<Projects.CookieJar_AppHost>();

          var server = builder.Resources
              .Single(r => r.Name == "server");
          Assert.Equal(2, server.GetReplicaCount());
    - - type: code
        language: csharp
        filename: CookieJarAppFixture.cs
        caption: 'E2E test: real containers, one start for all tests.'
        code: |
          App = await builder.BuildAsync(ct);
          await App.StartAsync(ct);
          await App.ResourceNotifications
              .WaitForResourceHealthyAsync("server", ct);

          var http = App.CreateHttpClient("server");
- id: test-apphost
  layout: content
  title: Change the AppHost for the test
  blocks:
  - type: text
    text: Before BuildAsync() the model is only data. You can remove, replace and add resources.
  - type: code
    language: csharp
    filename: CookieJarAppFixture.cs
    code: |
      // Parameters as arguments. The build agent needs no user secrets.
      var builder = await DistributedApplicationTestingBuilder.CreateAsync<Projects.CookieJar_AppHost>(
          ["Parameters:rabbitmq-password=e2e-test", "Parameters:cookie-jar-capacity=42"]);

      // No UI and no random sensor. The test sends the events itself.
      foreach (var r in builder.Resources.Where(r => r is PgAdminContainerResource
                   || r.Name.StartsWith("frontend") || r.Name.StartsWith("cookie-sensor")).ToList())
          builder.Resources.Remove(r);

      // An empty database. Do not touch the volume of the local environment.
      foreach (var mount in postgres.Annotations.OfType<ContainerMountAnnotation>().ToList())
          postgres.Annotations.Remove(mount);
  - type: callout
    variant: info
    title: Recommendation
    text: Remove the data volume in the test. Each run then starts with an empty database.
- id: tests-found-bugs
  layout: content
  title: The tests found two bugs
  blocks:
  - type: columns
    widths:
    - 4
    - 6
    columns:
    - - type: box
        items:
        - label: Parameter
          text: The test expected capacity 42 and got 100. AddParameter(name, "100") was a constant. Fixed.
        - label: SSE
          text: Each replica streams only the events that it consumed. Open on purpose.
      - type: text
        text: With one instance you see neither bug. With WithReplicas(2) in the test you see both at once.
    - - type: image
        src: img/test-output.png
        alt: 'Terminal. dotnet test passes 6 tests. The explicit SSE test fails: expected 100, 99, 98, 97, 96, actual 100, 99, 98.'
- id: project-a
  layout: content
  blocks:
  - type: heading
    label: From a real project
    title: A delivery service with two replicas
  - type: columns
    widths:
    - 6
    - 4
    columns:
    - - type: code
        language: csharp
        filename: E2ETestHost.cs
        code: |
          // Containers only for this run. No shared data.
          foreach (var r in appHost.Resources.OfType<ContainerResource>())
              r.Annotations.Add(new ContainerLifetimeAnnotation
                  { Lifetime = ContainerLifetime.Session });

          // The upstream system is a fake in the test process
          appHost.CreateResourceBuilder<ProjectResource>("api")
              .WithEnvironment("UPSTREAM_URL", fakeUpstream.Url);

          // Chaos: freeze the storage, then check the behavior
          await DockerAsync("pause", storageContainerId);
    - - type: box
        title: What the tests check
        items:
        - label: Lock
          text: Only one replica migrates. The cron job runs one time per tick.
        - label: Outage
          text: The cache answers. Else 503 with Retry-After.
        - label: Runtime
          text: Nightly, about 8 minutes.
  - type: callout
    variant: info
    title: Recommendation
    text: Run the E2E tests nightly. An environment variable turns the project on, thus the PR build skips it.
- id: project-b
  layout: content
  blocks:
  - type: heading
    label: From a real project
    title: A business application with a web UI
  - type: columns
    widths:
    - 6
    - 4
    columns:
    - - type: code
        language: csharp
        filename: AspireAppFixture.cs
        code: |
          appHost.CreateResourceBuilder<ProjectResource>("api")
              // The real external system is not reachable
              .WithEnvironment("EXTERNAL__MASTERDATA__BASEADDRESS",
                  "http://127.0.0.1:9")
              // Healthy = the API runs and asks for a login
              .WithHttpHealthCheck("/v1/me", statusCode: 401);

          await TestData.SeedAsync(NpgsqlDataSource.Create(
              await app.GetConnectionStringAsync("app-db")));
    - - type: list
        title: How the team works
        items:
        - One test for each acceptance criterion
        - UI, API and database in one run
        - Playwright keeps the trace only after a failure
  - type: callout
    variant: info
    title: Recommendation
    text: Make each external system unreachable in the test. Then no test can call it by mistake.
- id: compose
  layout: content
  title: Docker Compose
  blocks:
  - type: columns
    widths:
    - 5
    - 5
    columns:
    - - type: code
        language: csharp
        filename: AppHost.cs
        caption: Azure is a first-class target too. azd up reads the same model. It is not part of this demo.
        code: |
          builder.AddDockerComposeEnvironment("docker-compose")
              .ConfigureComposeFile(compose =>
              {
                  compose.Services["server"]
                      .DependsOn["postgres"]
                      .Condition = "service_healthy";
              });

          // aspire publish --output-path ./deploy/output
    - - type: code
        language: yaml
        filename: deploy/output/docker-compose/docker-compose.yaml
        caption: Generated. The secrets come from .env.
        code: |
          server:
            image: "${SERVER_IMAGE}"
            environment:
              CookieJar__Capacity: "${COOKIE_JAR_CAPACITY}"
              MESSAGING_PASSWORD: "${RABBITMQ_PASSWORD}"
            depends_on:
              postgres:
                condition: "service_healthy"
- id: kubernetes-kamal
  layout: content
  title: Kubernetes and Kamal
  blocks:
  - type: columns
    widths:
    - 5
    - 5
    columns:
    - - type: code
        language: csharp
        filename: AppHost.cs
        caption: 'Kubernetes (preview): a Helm chart. Use it as a start, not as the final chart.'
        code: |
          builder.AddKubernetesEnvironment("kubernetes");

          // aspire publish → deploy/output/helm
          // helm upgrade --install cookiejar \
          //     ./deploy/output/helm
    - - type: code
        language: csharp
        filename: AppHost.cs
        caption: 'Kamal: the open-source NuGet package Vensas.Aspire.Hosting.Kamal.'
        code: |
          builder.AddKamalEnvironment("kamal")
              .WithServers(vmIp)
              .WithRegistry(registry, "unused")
              .WithProxyHostSuffix($"{vmIp}.nip.io");

          server.PublishAsKamalService((_, config) =>
              config.Proxy!.Healthcheck =
                  new() { Path = "/health" });
- id: kamal-package
  layout: content
  title: From a custom step to a NuGet package
  blocks:
  - type: columns
    widths:
    - 5
    - 5
    columns:
    - - type: table
        rows:
        - key: AddProject, AddPythonApp
          value: One app with its own deploy.name.yml
        - key: Containers
          value: Accessories of the first app
        - key: WithExternalHttpEndpoints
          value: 'proxy: host, app_port, health check'
        - key: Secret parameters
          value: ".kamal/secrets, references only"
        - key: WithReference(server)
          value: Network alias server-web
      - type: stats
        items:
        - value: "−340"
          label: lines of custom code removed from the demo
          variant: accent
    - - type: code
        language: yaml
        filename: deploy/output/kamal/config/deploy.yml
        caption: Generated by aspire publish.
        code: |
          service: server
          image: cookiejar/server
          proxy:
            host: server.192.168.64.5.nip.io
            app_port: 8080
            healthcheck:
              path: /health
          env:
            secret:
              - ConnectionStrings__cookiejardb
          accessories:
            postgres:
              image: docker.io/library/postgres:18.3
- id: mcp
  layout: content
  title: 'Aspire MCP: the agent sees the running app'
  blocks:
  - type: text
    text: The MCP server gives the agent the resources, logs and traces of the running app. Not only the code.
  - type: code
    language: bash
    code: 'aspire agent init    # writes the MCP configuration for Claude Code, Copilot and others

      '
  - type: flow
    phases:
    - label: Step 1
      color: trust
      title: Prompt
      text: Why does replica 2 not stream the new level?
    - label: Step 2
      color: accent
      title: Resources
      text: list_resources gives the state of each replica.
    - label: Step 3
      color: green
      title: Logs
      text: list_structured_logs shows which replica consumed the event.
    - label: Step 4
      color: trust
      title: Answer
      text: The cause, with log lines. You decide on the fix.
- id: lessons
  layout: content
  title: TL;DR
  blocks:
  - type: steps
    steps:
    - title: Use Aspire for local development now.
      text: The full stack with one command, in any language, with OpenTelemetry.
    - title: Test with the real AppHost and two replicas.
      text: Aspire.Hosting.Testing found two bugs that one instance hides.
    - title: Outside Azure, plan time for the deployment.
      text: Compose and Helm are a start. Kamal shows that the provider model works.
    - title: 'AI: give the agent the running app with Aspire MCP.'
      text: Resources, logs and traces are the context. A human decides on the fix.
