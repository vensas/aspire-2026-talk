- id: internals
  layout: content
  title: How Aspire works
  blocks:
  - type: text
    text: <div class="card" style="width:100%;box-sizing:border-box;padding:16px 24px;border-left:4px solid var(--color-trust);"><div style="display:flex;align-items:baseline;gap:10px;margin-bottom:14px;"><h3 style="font-size:17px;font-weight:700;color:var(--text-trust);margin:0;">Runtime architecture</h3><span style="font-size:14px;color:var(--text-secondary);">The AppHost translates the model. DCP orchestrates the resources.</span><span style="margin-left:auto;font-size:12px;color:var(--text-secondary);opacity:0.8;">aspire.dev/architecture/overview</span></div><div style="display:flex;align-items:center;justify-content:center;flex-wrap:nowrap;"><div style="background:var(--slide-bg-card);border:1px solid var(--color-trust);border-radius:8px;padding:10px 20px;font-size:16px;font-weight:600;line-height:1.4;color:var(--text-trust);white-space:nowrap;text-align:center;">AppHost<br><span style="font-weight:400;font-size:13px;color:var(--text-secondary);">.NET</span></div><div style="display:flex;flex-direction:column;align-items:center;padding:0 14px;gap:2px;"><span style="font-size:20px;line-height:1;color:var(--text-secondary);">⇄</span><span style="font-size:12px;color:var(--text-secondary);white-space:nowrap;">KubernetesClient</span></div><div style="background:var(--slide-bg-card);border:1px solid var(--slide-border);border-radius:8px;padding:10px 20px;font-size:16px;font-weight:600;line-height:1.4;color:var(--text-primary);white-space:nowrap;text-align:center;">DCP<br><span style="font-weight:400;font-size:13px;color:var(--text-secondary);">Go binary</span></div><div style="display:flex;flex-direction:column;align-items:center;padding:0 14px;gap:2px;"><span style="font-size:20px;line-height:1;color:var(--text-secondary);">→</span><span style="font-size:12px;color:var(--text-secondary);white-space:nowrap;">starts and monitors</span></div><div style="background:var(--slide-bg-card);border:1px solid var(--slide-border);border-radius:8px;padding:10px 20px;font-size:16px;font-weight:600;line-height:1.4;color:var(--text-primary);white-space:nowrap;text-align:center;">Resources<br><span style="font-weight:400;font-size:13px;color:var(--text-secondary);">containers and processes</span></div><div style="display:flex;flex-direction:column;align-items:center;padding:0 14px;gap:2px;"><span style="font-size:20px;line-height:1;color:var(--text-secondary);">→</span><span style="font-size:12px;color:var(--text-secondary);white-space:nowrap;">OTLP</span></div><div style="background:var(--slide-bg-card);border:1px solid var(--color-trust);border-radius:8px;padding:10px 20px;font-size:16px;font-weight:600;line-height:1.4;color:var(--text-trust);white-space:nowrap;text-align:center;">Dashboard<br><span style="font-weight:400;font-size:13px;color:var(--text-secondary);">separate process</span></div></div></div>
  - type: card-grid
    columns: 2
    cards:
    - variant: quality
      title: Annotation model
      text: Each resource is an <code style="color:var(--text-primary);">IResource</code> with annotations. <code style="color:var(--text-primary);">Build()</code> makes the model real.
    - variant: funding
      title: WithReference
      text: <code style="color:var(--text-primary);">.WithReference(db)</code> gives <code style="color:var(--text-primary);">ConnectionStrings__&lt;name&gt;</code> as an environment variable, with the dynamic port.
    - variant: trust
      title: Service discovery
      text: Aspire gives the service URLs as environment variables. With <code style="color:var(--text-primary);">AddServiceDefaults()</code>, <code style="color:var(--text-primary);">http://server</code> works without more configuration.
    - variant: quality
      title: WaitFor
      text: <code style="color:var(--text-primary);">.WaitFor(x)</code> holds the start until the dependency is healthy.
- id: project-a
  layout: content
  blocks:
  - type: heading
    label: From a real project
    title: A delivery service with two replicas
  - type: columns
    widths:
    - 6
    - 4
    columns:
    - - type: code
        language: csharp
        filename: E2ETestHost.cs
        code: |
          // Containers only for this run. No shared data.
          foreach (var r in appHost.Resources.OfType<ContainerResource>())
              r.Annotations.Add(new ContainerLifetimeAnnotation
                  { Lifetime = ContainerLifetime.Session });

          // The upstream system is a fake in the test process
          appHost.CreateResourceBuilder<ProjectResource>("api")
              .WithEnvironment("UPSTREAM_URL", fakeUpstream.Url);

          // Chaos: freeze the storage, then check the behavior
          await DockerAsync("pause", storageContainerId);
    - - type: box
        title: What the tests check
        items:
        - label: Lock
          text: Only one replica migrates. The cron job runs one time per tick.
        - label: Outage
          text: The cache answers. Else 503 with Retry-After.
        - label: Runtime
          text: Nightly, about 8 minutes.
  - type: callout
    variant: info
    title: Recommendation
    text: Run the E2E tests nightly. An environment variable turns the project on, thus the PR build skips it.
