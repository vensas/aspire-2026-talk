  layout: content
  blocks:
  - type: heading
    label: From a real project
    title: A business application with a web UI
  - type: columns
    widths:
    - 6
    - 4
    columns:
    - - type: code
        language: csharp
        filename: AspireAppFixture.cs
        code: |
          appHost.CreateResourceBuilder<ProjectResource>("api")
              // The real external system is not reachable
              .WithEnvironment("EXTERNAL__MASTERDATA__BASEADDRESS",
                  "http://127.0.0.1:9")
              // Healthy = the API runs and asks for a login
              .WithHttpHealthCheck("/v1/me", statusCode: 401);

          await TestData.SeedAsync(NpgsqlDataSource.Create(
              await app.GetConnectionStringAsync("app-db")));
    - - type: list
        title: How the team works
        items:
        - One test for each acceptance criterion
        - UI, API and database in one run
        - Playwright keeps the trace only after a failure
  - type: callout
    variant: info
    title: Recommendation
    text: Make each external system unreachable in the test. Then no test can call it by mistake.
- id: testing
  layout: content
  title: Test the real app
  blocks:
  - type: text
    text: Aspire.Hosting.Testing starts your AppHost in the test. The test gets the same services and containers as <code>aspire run</code>.
  - type: columns
    widths:
    - 5
    - 5
    columns:
    - - type: text
        text: <strong style="color:var(--text-accent);">1</strong> <strong style="color:var(--text-primary);">Check the model. No containers start.</strong>
      - type: code
        language: csharp
        filename: AppModelTests.cs
        code: |
          var builder = await DistributedApplicationTestingBuilder
              .CreateAsync<Projects.CookieJar_AppHost>();

          var server = builder.Resources
              .Single(r => r.Name == "server");
          Assert.Equal(2, server.GetReplicaCount());
    - - type: text
        text: <strong style="color:var(--text-accent);">2</strong> <strong style="color:var(--text-primary);">Start the app and send a request.</strong>
      - type: code
        language: csharp
        filename: CookieJarAppFixture.cs
        code: |
          App = await builder.BuildAsync(ct);
          await App.StartAsync(ct);
          await App.ResourceNotifications
              .WaitForResourceHealthyAsync("server", ct);

          var http = App.CreateHttpClient("server");
  - type: callout
    variant: info
    title: Recommendation
    text: Run step 1 in each PR build. It takes less than 1 s. Step 2 starts the containers one time for all tests.
- id: test-apphost
  layout: content
  title: Prepare the AppHost for the test
  blocks:
  - type: text
    text: Before <code>BuildAsync()</code>, the test can change the app model. Three changes make the test reliable.
  - type: code
    language: csharp
    filename: CookieJarAppFixture.cs
    code: |
      // 1. Give the parameters as arguments. No user secrets are necessary.
      var builder = await DistributedApplicationTestingBuilder.CreateAsync<Projects.CookieJar_AppHost>(
          ["Parameters:rabbitmq-password=e2e-test", "Parameters:cookie-jar-capacity=42"]);

      // 2. Remove the UI and the random sensor. The test sends the events.
      foreach (var r in builder.Resources.Where(r => r is PgAdminContainerResource
                   || r.Name.StartsWith("frontend") || r.Name.StartsWith("cookie-sensor")).ToList())
          builder.Resources.Remove(r);

      // 3. Remove the data volume. Each run starts with an empty database.
      foreach (var mount in postgres.Annotations.OfType<ContainerMountAnnotation>().ToList())
          postgres.Annotations.Remove(mount);
  - type: callout
    variant: info
    text: The changes apply only to the test. <code>aspire run</code> does not change.
- id: replicas-in-tests
  layout: content
  title: Two replicas show a bug
  blocks:
  - type: text
    text: The test starts 2 server replicas, as in production. It sends 4 events. Each replica must stream all 4 to its browsers.
  - type: columns
    widths:
    - 5
    - 5
    columns:
    - - type: code
        language: csharp
        filename: CookieJarTests.cs
        code: |
          // One live stream per replica, like two browsers
          var streams = fixture.Replicas
              .Select(ReadLevelStreamAsync).ToList();

          for (var i = 0; i < 4; i++)
              await PublishCookieTakenAsync(amount: 1);

          foreach (var stream in streams)
              Assert.Equal([100, 99, 98, 97, 96], await stream);
    - - type: image
        src: img/test-sse-failure.png
        alt: Test output. LevelStream_OnEveryReplica_ReceivesEveryChange fails. Expected 100, 99, 98, 97, 96. Actual 100, 99, 98.
  - type: columns
    widths:
    - 5
    - 5
    columns:
    - - type: callout
        variant: warning
        title: The bug
        text: RabbitMQ gives each event to one replica only.
    - - type: callout
        variant: trust
        title: With 1 instance
        text: The same test passes. The bug stays hidden.
